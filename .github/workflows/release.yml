name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: cargo install cross --locked
      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cargo build --release --target "${{ matrix.target }}"
          else
            cross build --release --target "${{ matrix.target }}"
          fi
      - name: Package
        env:
          PICO_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/pico
        run: sh scripts/build-standalone.sh "${GITHUB_REF_NAME#v}" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pico-${{ matrix.target }}
          path: dist/*

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target "${{ matrix.target }}"
      - name: Package
        env:
          PICO_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/pico
        run: sh scripts/build-standalone.sh "${GITHUB_REF_NAME#v}" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pico-${{ matrix.target }}
          path: dist/*

  freebsd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-freebsd
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --locked
      - name: Build
        run: cross build --release --target "${{ matrix.target }}"
      - name: Package
        env:
          PICO_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/pico
        run: sh scripts/build-standalone.sh "${GITHUB_REF_NAME#v}" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pico-${{ matrix.target }}
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = "0.1.8" }
          $name = "pico-$version-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/pico.exe" "dist/$name/pico.exe"
          Copy-Item README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -FilePath "dist/$name.zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: pico-x86_64-pc-windows-msvc
          path: dist/*

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package
        env:
          PICO_BIN: ${{ github.workspace }}/target/release/pico
        run: sh scripts/build-deb.sh "${GITHUB_REF_NAME#v}" x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: pico-deb-amd64
          path: dist/*

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: dnf install -y rust cargo rpm-build tar gzip
      - name: Build
        run: cargo build --release
      - name: Package
        env:
          PICO_BIN: ${{ github.workspace }}/target/release/pico
        run: sh scripts/build-rpm.sh "${GITHUB_REF_NAME#v}" x86_64-unknown-fedora
      - uses: actions/upload-artifact@v4
        with:
          name: pico-rpm-x86_64
          path: dist/*

  arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Build
        run: cargo build --release
      - name: Package
        env:
          PICO_BIN: ${{ github.workspace }}/target/release/pico
        run: sh scripts/build-arch.sh "${GITHUB_REF_NAME#v}" x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: pico-arch-x86_64
          path: dist/*

  release:
    needs: [linux, macos, freebsd, windows, deb, rpm, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
